project:
  title: "PUCV 3LFCC Controller"
  author: "Jorge Marin / PUCV"
  discord: ""
  description: "3LFCC flying-capacitor controller with dual ADS1115 I2C ADCs, phase-shift PWM, OLED display and UART control"
  language: "Verilog"
  clock_hz: 27000000
  tiles: "8x2"
  top_module: "tt_um_jmarin_3lfcc"
  source_files:
    - "project.v"
    - "top.v"
    - "Comparator.v"
    - "Dead_Time_Generator.v"
    - "PS_PWM.v"
    - "Signal_Generator_0phase.v"
    - "Signal_Generator_180phase.v"
    - "adc.v"
    - "fcc_fixpt.v"
    - "i2c.v"
    - "screen.v"
    - "text.v"
    - "font_rom.v"
    - "timer_control.v"
    - "toDec.v"
    - "toHex.v"
    - "uart.v"
pinout:
  ui[0]: "BTN1"
  ui[1]: "UART_RX"
  ui[2]: "unused"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"
  uo[0]: "PWM0"
  uo[1]: "PWM1"
  uo[2]: "PWM2"
  uo[3]: "PWM3"
  uo[4]: "DEBUG_CONST1"
  uo[5]: "HEARTBEAT"
  uo[6]: "DEBUG_CONST0"
  uo[7]: "DEBUG_CONST0"
  uio[0]: "ADC1_SCL"
  uio[1]: "ADC2_SCL"
  uio[2]: "OLED_SCLK"
  uio[3]: "OLED_SDIN"
  uio[4]: "OLED_CS"
  uio[5]: "OLED_DC"
  uio[6]: "ADC1_SDA_BIDIR"
  uio[7]: "ADC2_SDA_BIDIR"
yaml_version: 6
